allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
    - '@tanstack/query-core@5.108.4'
    - '@tanstack/react-query@5.108.4'
    - '@xyflow/react@13.0.3'
    - '@xyflow/system@1.0.1'
    - lucide-react@1.78.0
permissions:
  '@tanstack/react-table':
    skills: [getting-started, migrate-v8-to-v9, table-state]
  ai:
    skills: true
skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
    - .windsurf/skills
